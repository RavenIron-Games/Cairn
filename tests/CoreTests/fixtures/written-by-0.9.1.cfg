## Settings file was created by plugin Cairn v0.9.1
## Plugin GUID: com.raveniron.cairn

[1 - Core]

## Master switch. False leaves the plugin loaded and the console registered, but nothing ticks.
# Setting type: Boolean
# Default value: true
Enabled = true

## Milliseconds per frame CairnTick may spend across ALL systems. Work that does not fit resumes next frame from where the cursor stopped.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0.25 to 10
TickBudgetMs = 2

## Per-tick detail. Off by default: it is loud enough to hide the lines that matter.
# Setting type: Boolean
# Default value: false
VerboseLogging = false

## How often the landmark ledger is written when it has changed. Time-based rather than change-based on purpose: a busy world would otherwise write on every sweep, and an idle one would never write at all.
# Setting type: Single
# Default value: 60
# Acceptable value range: From 5 to 600
AutosaveIntervalSeconds = 60

[2 - Landmarks]

## The sweep that turns named signs into landmarks. Off leaves the ledger frozen at whatever it already holds.
# Setting type: Boolean
# Default value: true
EnableLandmarks = true

## Seconds for a FULL rotation over every sign and stone prefab — which is how long a newly built cairn can take to be noticed. Each prefab is swept one at a time at rotation/count, so adding a prefab makes each step shorter rather than the wait longer. It used to govern each PREFAB, which made four prefabs a three-minute wait; latency should not be a tax on the length of a config list. TRADE-OFF: a shorter rotation touches the ZDO index more often, which is the thing AwayFromHome also scans every 60s. Raise it on a heavily modded server if sweeps ever show up in a profile.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 4 to 600
LandmarkRotationSeconds = 20

## Comma-separated prefab names treated as signs. CONFIG rather than code because these are data about the game's content: they drift with game patches and modded pieces, and a wrong name costs a silent zero matches. The first sweep of each session logs its per-prefab counts so a wrong name is visible in the log. Both defaults confirmed in-game 2026-09-02 by `cairn prefabs sign`: exactly two of 3458 prefabs contain "sign", and these are they.
# Setting type: String
# Default value: sign,sign_notext
SignPrefabs = sign,sign_notext

[3 - Cairn piles]

## Comma-separated stone pieces a cairn can be built from. Both confirmed BUILDABLE in-game 2026-09-02 by `cairn pieces stone`: Placeable_Stone is [Hoe] Stone x1 — a single stone you stack, which is what a cairn actually is — and stone_pile is [Hammer] Stone x50, one pre-made heap. Architecture is deliberately absent: walls and floors would only feed the footprint rule things it is going to reject, and leaving them out means a stone HOUSE can never become a landmark.
# Setting type: String
# Default value: Placeable_Stone,stone_pile
StonePrefabs = Placeable_Stone,stone_pile

## Stones within this distance of each other belong to the same pile. Linking is transitive, so a chain of stones forms ONE cluster — which is what lets a long wall be measured, and rejected, as a whole.
# Setting type: Single
# Default value: 2.5
# Acceptable value range: From 0.5 to 10
PileLinkMeters = 2.5

## Fewer stones than this is a dropped rock, not a cairn. At 1 stone per Placeable_Stone the price signals nothing, so DELIBERATENESS is carried by this count and the footprint rule instead — which is the job they were written for. Raise it if scattered decorative stones start lighting up.
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 2 to 20
PileMinPieces = 4

## More than this is a structure. A backstop only — the footprint rule does the real work, because piece count alone can never tell a tidy wall from a waymark.
# Setting type: Int32
# Default value: 12
# Acceptable value range: From 3 to 100
PileMaxPieces = 12

## THE rule. A cairn is narrow; a building is wide. Widest horizontal span a cluster may cover before it is judged architecture rather than a waymark.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 1 to 20
PileMaxExtentMeters = 4

## How far from a pile a named sign may stand and still name it. Measured XZ-planar: a sign set into a cairn's flank sits metres below its crown, and a 3D check would put it out of reach for no reason a player could see.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 1 to 30
LandmarkPairMeters = 6

## How far an UNNAMED cairn's crown may move between sweeps and still be the same cairn. A crown is a computed centroid, so adding a stone shifts it — and on 2026-09-02 a live cairn drifted 0.8m, crossed a metre boundary, and was pruned and re-founded with its history erased. Within this distance the old FirstSeen follows the cairn to its new key instead. Defaults to the footprint limit: a cairn that moved less than its own width has not become a different place. Named cairns never need this — they are keyed on a sign, and signs do not move.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0 to 20
PileDriftMeters = 4

## Stone required to build one vanilla 'stone_pile'. 0 means DO NOT TOUCH THE GAME, and that is now the default. Any other value edits a vanilla recipe — the only thing in this mod that reaches outside its own scope — and announces itself in the log with the before and the after, because a mod that silently rewrites a recipe is exactly the surprise this studio dislikes in others. It briefly shipped at 10, when stone_pile at 50 stone looked like the only way to make cairns affordable. Then `cairn pieces stone` turned up Placeable_Stone at ONE stone, the problem the override existed to solve stopped existing, and the right move was to hand vanilla back. Kept as a switch for anyone who prefers heaps to stacks. PER PLAYER: the cost is charged by the building player's own game, so this applies to whoever sets it in their own config. It is not sent from the server, and setting it on a dedicated server changes nothing for players.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 100
StonePileStoneCost = 0

[4 - The light]

## Draw a light on top of every cairn. Client-side and purely visual: turning it off changes nothing the server knows, and the ledger keeps recording places.
# Setting type: Boolean
# Default value: true
EnableBeacons = true

## How often the server broadcasts every lit cairn to everyone. Absolute snapshots, sent whether or not anything changed: a delta scheme drifts forever on one dropped packet, and this heals itself within one cadence.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 5 to 120
BeaconSyncSeconds = 5

## Most cairns carried in one broadcast. A bound on the packet, not a limit anyone should reach.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 1 to 500
BeaconMaxCount = 100

## How far a beacon can be seen before it fades out entirely.
# Setting type: Single
# Default value: 800
# Acceptable value range: From 50 to 4000
BeaconMaxDistanceMeters = 800

## THE reason a beacon is visible at range. The glow is scaled BY DISTANCE, so it holds roughly constant size on screen instead of shrinking away — 0.03 means a 12m glow at 400m, about 1.7 degrees, which is a clear point of light rather than a smudge. A fixed-size glow would be the wrong shape of thing entirely.
# Setting type: Single
# Default value: 0.03
# Acceptable value range: From 0.005 to 0.2
BeaconAngularSize = 0.03

## Floor on the glow's world size, so standing next to a cairn does not put a speck on the stones.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0.2 to 20
BeaconMinSizeMeters = 1.5

## Ceiling on the glow's world size, so a distant beacon stays a point of light rather than becoming a wall of it.
# Setting type: Single
# Default value: 14
# Acceptable value range: From 1 to 100
BeaconMaxSizeMeters = 14

## How far above the cairn's crown the light sits.
# Setting type: Single
# Default value: 1.2
# Acceptable value range: From 0 to 10
BeaconHeightMeters = 1.2

## Beacon colour as hex — RGB, RRGGBB or RRGGBBAA, with or without a leading #. The default is firelight. A value that will not parse falls back to that and says so once in the log, because a beacon silently drawing black looks exactly like a beacon that is not drawing at all.
# Setting type: String
# Default value: FFB85A
BeaconColour = FFB85A

## Terrain hides a beacon. LEAVE THIS ON. A glow that shines through a mountain is not a beacon, it is a waypoint marker in a costume, and house rule A forbids exactly that — a ridge between you and a cairn should mean you have to move, which is the difference between navigating and being told. Off is for diagnosing whether a beacon is missing or merely hidden.
# Setting type: Boolean
# Default value: true
BeaconOcclusion = true

[5 - The raven]

## Let Hugin say the name of a named landmark you are standing in. FLAVOUR, never a navigation channel — vanilla refuses to land the bird below 30m of altitude, with a hostile within 10m, or during any world event, so it is silent exactly when you would most want it. Off changes nothing else.
# Setting type: Boolean
# Default value: true
EnableRavenVoice = true

## How close you must stand to a NAMED landmark before the line is offered. Kept inside the raven's own 15m spawn distance, or the bird would be carrying a message about somewhere it cannot reach.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 2 to 15
RavenNameMeters = 12

## Longest spoken name before it is cut with an ellipsis. Rich text is always stripped before speaking — storage stays faithful to what the player typed, the display decides what may be said, and that is the moderation question the scope doc left open being answered conservatively.
# Setting type: Int32
# Default value: 64
# Acceptable value range: From 8 to 200
RavenNameMaxLength = 64

